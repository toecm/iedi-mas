[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iedi-mas"
version = "0.2.0"
description = "Paper-aligned Intra-English Dialect Interpretation multi-agent reference implementation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "IUUY / IEDI-MAS contributors" }]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
audio = ["numpy>=1.26", "librosa>=0.10", "openai-whisper>=20240930"]
diarization = ["pyannote.audio>=3.3"]
hf = ["huggingface-hub>=0.25"]
provenance = ["requests>=2.31", "web3>=7"]
ui = ["gradio>=5", "pandas>=2"]
cloud = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
evaluation = ["numpy>=1.26", "sentence-transformers>=3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
